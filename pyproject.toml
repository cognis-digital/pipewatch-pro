[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cognis-pipewatch-pro"
version = "0.3.4"
description = "CI/CD supply-chain auditor — GH Actions / GitLab CI / OWASP CI/CD Top 10 + offline OSV enrichment"
authors = [{name = "Cognis Digital", email = "suite@cognis.digital"}]
license = {text = "LicenseRef-COCL-1.0"}
requires-python = ">=3.10"
readme = "README.md"
keywords = ["dev-supply-chain", "cognis-digital", "cognis-neural-suite", "security"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
connect = ["cognis-connect @ git+https://github.com/cognis-digital/cognis-connect.git"]
mcp = ["mcp>=1.0"]
web = ["fastapi>=0.110", "uvicorn>=0.27"]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://cognis.digital"
Repository = "https://github.com/cognis-digital/pipewatch-pro"

[project.scripts]
"pipewatch-pro-emit" = "pipewatch_pro.connect:emit_main"
pipewatch-pro = "pipewatch_pro.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["pipewatch_pro"]

[tool.hatch.build.targets.wheel.force-include]
"pipewatch_pro/cognis_vulndb.jsonl.gz" = "pipewatch_pro/cognis_vulndb.jsonl.gz"
"pipewatch_pro/data_feeds_2026.json" = "pipewatch_pro/data_feeds_2026.json"

[tool.hatch.metadata]
allow-direct-references = true
